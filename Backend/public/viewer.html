<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GLB Viewer</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
            touch-action: none;
        }

        canvas {
            display: block;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: sans-serif;
            font-size: 15px;
            z-index: 100;
            background: transparent;
            pointer-events: none;
        }

        #loading.hidden {
            display: none;
        }
    </style>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.178.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.178.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="loading">読み込み中...</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

const scene = new THREE.Scene();
// 背景は透過（RN側の背景が透けて見えるように）
scene.background = null;

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth / window.innerHeight,
    0.01,
    10000
);

camera.position.set(0, 1, 3);

const renderer = new THREE.WebGLRenderer({
    antialias: true,
    alpha: true,
});

renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enablePan = false;
controls.zoomSpeed = 1.15;
controls.minDistance = 0.5;
controls.maxDistance = 10;

scene.add(new THREE.AmbientLight(0xffffff, 2));

const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
directionalLight.position.set(5, 10, 5);
scene.add(directionalLight);

const directionalLight2 = new THREE.DirectionalLight(0xffffff, 2);
directionalLight2.position.set(-5, 5, -5);
scene.add(directionalLight2);

const loader = new GLTFLoader();

// glb = ベースのアバター（既定: 何も着ていない状態）
// cloth = アバターに重ねる服単体GLB（0個以上、?cloth=A&cloth=B のように複数指定可）
// cloth 側は Blender フィッティング時に既にアバターと同じ座標系に
// 揃えられているので、ベースと同じオフセットだけを適用して重ねる。
const params = new URLSearchParams(location.search);
const glbPath = params.get("glb") || "/models/koba.glb";
const clothPaths = params.getAll("cloth");

const loadingEl = document.getElementById("loading");
const loadedModels = [];
let modelSphere = null;

function fitCameraToModel(resetPosition = true) {
    if (!modelSphere) return;
    const radius = modelSphere.radius || 1;
    const verticalHalfFov = THREE.MathUtils.degToRad(camera.fov * 0.5);
    const horizontalHalfFov = Math.atan(Math.tan(verticalHalfFov) * camera.aspect);
    const limitingHalfFov = Math.min(verticalHalfFov, horizontalHalfFov);
    // どの向きに回転しても全身（腕を含む）が画面内に残る距離。
    const fitDistance = radius / Math.sin(limitingHalfFov);
    // 初期表示には十分な余白を持たせ、そこから全身が収まる限界まで
    // ピンチ操作で明確にズームできる幅を確保する。
    const initialDistance = fitDistance * 1.6;

    if (resetPosition) {
        camera.position.set(modelSphere.center.x, modelSphere.center.y, modelSphere.center.z + initialDistance);
    } else if (camera.position.distanceTo(modelSphere.center) < fitDistance) {
        camera.position.sub(modelSphere.center).setLength(fitDistance).add(modelSphere.center);
    }
    camera.lookAt(modelSphere.center);
    controls.target.copy(modelSphere.center);
    // 腕や全身が画面外に出ても、服の細部まで寄って確認できるようにする。
    controls.minDistance = fitDistance * 0.28;
    controls.maxDistance = fitDistance * 5;
    controls.update();
}

function finish() {
    const box = new THREE.Box3();
    loadedModels.forEach((m) => box.expandByObject(m));
    modelSphere = box.getBoundingSphere(new THREE.Sphere());
    fitCameraToModel();

    loadingEl.classList.add("hidden");
    if (window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage("ready");
    }
}

loader.load(
    glbPath,

    (gltf) => {
        const model = gltf.scene;
        const box = new THREE.Box3().setFromObject(model);
        const center = box.getCenter(new THREE.Vector3());
        model.position.sub(center);
        scene.add(model);
        loadedModels.push(model);

        if (clothPaths.length === 0) {
            finish();
            return;
        }

        let remaining = clothPaths.length;
        clothPaths.forEach((clothPath) => {
            loader.load(
                clothPath,
                (clothGltf) => {
                    const clothModel = clothGltf.scene;
                    clothModel.position.sub(center);
                    scene.add(clothModel);
                    loadedModels.push(clothModel);
                    remaining -= 1;
                    if (remaining === 0) finish();
                },
                undefined,
                (error) => {
                    // 服1点の読み込み失敗はアバター表示自体は継続する
                    console.warn("cloth load failed, skipping:", clothPath, error);
                    remaining -= 1;
                    if (remaining === 0) finish();
                }
            );
        });
    },

    () => {
        // 進捗はRN側のローディングUIに任せるのでここでは何もしない
    },

    (error) => {
        console.error(error);
        loadingEl.textContent = "モデルの読み込みに失敗しました";
        if (window.ReactNativeWebView) {
            window.ReactNativeWebView.postMessage("error:" + (error?.message || "unknown"));
        }
    }
);

window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    fitCameraToModel(false);
});

// タップ（ドラッグを伴わない短い接触）を RN 側に伝える
// （ドロワーを閉じる用。OrbitControls のドラッグ回転とは干渉しない）
let pointerDownAt = null;
let pointerDownPos = null;

renderer.domElement.addEventListener("pointerdown", (e) => {
    pointerDownAt = Date.now();
    pointerDownPos = { x: e.clientX, y: e.clientY };
});

renderer.domElement.addEventListener("pointerup", (e) => {
    if (pointerDownAt === null) return;
    const dt = Date.now() - pointerDownAt;
    const dx = e.clientX - pointerDownPos.x;
    const dy = e.clientY - pointerDownPos.y;
    const dist = Math.sqrt(dx * dx + dy * dy);
    pointerDownAt = null;

    if (dt < 300 && dist < 8 && window.ReactNativeWebView) {
        window.ReactNativeWebView.postMessage("tap");
    }
});

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}

animate();
</script>

</body>
</html>
