server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # GLB / 生成画像はそれなりに大きい
    client_max_body_size 50m;

    # Docker の組み込みDNS。proxy_pass にホスト名を直書きすると nginx は
    # 起動時に一度だけ名前解決してそのIPを握り続けるため、api コンテナを
    # 作り直すと web だけ 502 になる。変数経由にしてリクエスト毎に引き直す。
    resolver 127.0.0.11 valid=10s ipv6=off;

    # プロキシ共通設定（server に置いて各 location に継承させる）
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Meshy / Blender の処理は数分かかることがある
    proxy_read_timeout 900s;
    proxy_send_timeout 900s;

    # ---------------------------------------------------------------------
    #  /assets/ は Expo Web の同梱アセット（/assets/assets/*, /assets/node_modules/*）と
    #  api が配信する画像（server.ts の express.static("/assets")）が同居する。
    #  まず nginx 自身のファイルを探し、無ければ api に回す。
    #  ^~ は下の正規表現 location より優先させるため。
    # ---------------------------------------------------------------------
    location ^~ /assets/ {
        try_files $uri @api;
    }

    # API と、api コンテナが配信する残りの静的ファイル。
    # server.ts のマウント: /api/*, /models, および public 直下（/uploads, /generated）。
    location ~ ^/(api|models|uploads|generated)/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
    }

    location = /viewer.html {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
    }

    location @api {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream;
    }

    # SPA ルーティング（上記以外はすべて index.html に流す）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
