services:
  app:
    build: .
    container_name: reactnative-app

    working_dir: /app

    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP}:8001
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true

    stdin_open: true
    tty: true

    command: npx expo start --host lan

    
    